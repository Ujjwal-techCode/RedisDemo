services:
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis-volume:/app

  spring-app:
    container_name: spring_app_container
    build: . # Points to the Dockerfile of your Spring Boot app
    ports:
      - "9091:8081"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis

volumes:
  redis-volume: