services:
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis-volume:/app

  spring-app:
    container_name: spring_app_container
    image: ${DOCKER_IMAGE_NAME:-redis-demo-spring-boot-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9091:8081"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis

volumes:
  redis-volume: