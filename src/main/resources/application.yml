spring:
  application:
    name: WeatherReport
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
  h2:
    console:
      enabled: true
  cache:
    type: redis
    cache-names: weather
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

logging:
  level:
    org.springframework.web: "TRACE"
